# Dependabot — automated update PRs for Ditto first-party packages only
# (SDK + tools). All platforms are combined into one PR per release via a
# multi-ecosystem group. https://docs.github.com/code-security/dependabot
version: 2
multi-ecosystem-groups:
  ditto:
    schedule:
      interval: "weekly"
updates:
  # Android — Gradle (com.ditto: SDK + tools)
  - package-ecosystem: "gradle"
    directory: "/android"
    multi-ecosystem-group: "ditto"
    patterns:
      - "com.ditto:*"

  # Swift — SwiftPM pins from the Xcode project.
  - package-ecosystem: "swift"
    directory: "/swift"
    multi-ecosystem-group: "ditto"
    patterns:
      - "github.com/getditto/*"

  # Flutter — pubspec constraints.
  - package-ecosystem: "pub"
    directory: "/flutter"
    multi-ecosystem-group: "ditto"
    patterns:
      - "ditto_live"
      - "ditto_flutter_tools"

  # React Native — npm package and tools.
  - package-ecosystem: "npm"
    directory: "/rn-expo"
    multi-ecosystem-group: "ditto"
    patterns:
      - "@dittolive/ditto"
      - "@dittolive/ditto-react-native-tools"

  # Web — npm package.
  - package-ecosystem: "npm"
    directory: "/web"
    multi-ecosystem-group: "ditto"
    patterns:
      - "@dittolive/ditto"
